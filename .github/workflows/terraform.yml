name: Terraform

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'
  push:
    branches: [main]
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: '1.16.6'
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'

jobs:
  validate:
    name: fmt y validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff ..

      - name: terraform init (sin backend)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate -no-color

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0

      - name: tflint
        run: tflint --format compact

  # Los PR desde forks no reciben token OIDC ni variables: allí solo corre validate.
  plan-omitted:
    name: plan (omitido)
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.pull_request.head.repo.full_name != github.repository || vars.PLAN_CLIENT_ID == '')
    runs-on: ubuntu-latest
    steps:
      - run: echo "::notice::El plan requiere un PR desde ${{ github.repository }} y las variables de Azure configuradas; este PR solo ejecuta fmt y validate."

  plan:
    name: speculative plan
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.PLAN_CLIENT_ID != ''
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/terraform
    env:
      ARM_CLIENT_ID: ${{ vars.PLAN_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: 'true'
      ARM_USE_AZUREAD: 'true'
      ARM_USE_CLI: 'false'
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_name_suffix: ${{ vars.INFRA_NAME_SUFFIX }}
      TF_VAR_admin_ssh_public_key: ${{ vars.INFRA_ADMIN_SSH_PUBLIC_KEY }}
      TF_VAR_admin_cidrs: ${{ vars.INFRA_ADMIN_CIDRS }}
      TF_VAR_budget_contact_emails: ${{ vars.INFRA_BUDGET_CONTACT_EMAILS }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -backend-config=backend.hcl

      - name: terraform plan (no aplicable)
        run: |
          set -o pipefail
          terraform plan -lock-timeout=5m -no-color | tee plan.txt

      - name: Publicar plan
        if: always()
        run: |
          [ -f plan.txt ] || exit 0
          {
            echo '### Plan de infraestructura'
            grep -E '^(Plan:|No changes\.)' plan.txt || true
            echo '<details><summary>Salida completa</summary>'
            echo
            echo '```'
            cat plan.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar el plan como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-pr-${{ github.event.pull_request.number }}
          path: infra/terraform/plan.txt
          if-no-files-found: ignore
          retention-days: 14

  # Solo cambios ya integrados a main. El environment azure-infra exige la
  # aprobación de un revisor antes de entregar el token de la identidad apply.
  # Sin APPLY_CLIENT_ID (repo aún no configurado) el job no corre.
  apply:
    name: apply controlado
    if: github.event_name != 'pull_request' && vars.APPLY_CLIENT_ID != ''
    needs: validate
    runs-on: ubuntu-latest
    environment: azure-infra
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/terraform
    env:
      ARM_CLIENT_ID: ${{ vars.APPLY_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: 'true'
      ARM_USE_AZUREAD: 'true'
      ARM_USE_CLI: 'false'
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_name_suffix: ${{ vars.INFRA_NAME_SUFFIX }}
      TF_VAR_admin_ssh_public_key: ${{ vars.INFRA_ADMIN_SSH_PUBLIC_KEY }}
      TF_VAR_admin_cidrs: ${{ vars.INFRA_ADMIN_CIDRS }}
      TF_VAR_budget_contact_emails: ${{ vars.INFRA_BUDGET_CONTACT_EMAILS }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -backend-config=backend.hcl

      - name: terraform plan (plan guardado)
        run: terraform plan -lock-timeout=5m -no-color -out=tfplan

      - name: terraform apply del plan guardado
        run: terraform apply -lock-timeout=5m -no-color tfplan

      - name: Resumen
        run: |
          {
            echo '### Infraestructura aplicada'
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- VM: $(terraform output -raw vm_name) ($(terraform output -raw vm_size))"
            echo "- DNS público: $(terraform output -raw public_fqdn)"
            echo "- K3s: $(terraform output -raw k3s_version)"
          } >> "$GITHUB_STEP_SUMMARY"
